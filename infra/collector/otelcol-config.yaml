apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: monitoring
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"

    processors:
      batch:
        timeout: 5s
        send_batch_size: 1000
      memory_limiter:
        check_interval: 1s
        limit_mib: 512

    exporters:
      prometheusremotewrite:
        # ⚠️ 2026-09-16 修正：原值是 http://prometheus-server.monitoring.svc.cluster.local:80/api/v1/write
        #    `prometheus-server` 是 **standalone prometheus chart** 的服务名，
        #    kube-prometheus-stack 里不存在 → DNS 解析失败 →
        #    日志刷 "Permanent error: context deadline exceeded"（指标被丢弃）。
        #    实测 kube-prometheus-stack 的服务名是 prometheus-kube-prometheus-prometheus，
        #    端口 9090（`kubectl -n monitoring get svc` 确认）。
        endpoint: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:9464"
      otlp/tempo:
        endpoint: "http://tempo.monitoring.svc.cluster.local:4317"
        tls:
          insecure: true
      loki:
        endpoint: "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        default_labels_enabled:
          exporter: false
          job: true
      debug:
        verbosity: basic

    # spanmetrics derives uniform RED metrics (calls_total, duration_*) from every span,
    # labelled by service_name/status_code. This gives language-agnostic per-service error
    # rate + latency, instead of the polyglot zoo (http_server_* vs rpc_server_* vs ...).
    connectors:
      spanmetrics:
        histogram:
          explicit:
            buckets: [2ms, 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s]
        dimensions:
          - name: http.response.status_code
          - name: rpc.grpc.status_code
        exemplars:
          enabled: false
        metrics_flush_interval: 15s

    service:
      pipelines:
        metrics:
          receivers: [otlp, spanmetrics]
          processors: [memory_limiter, batch]
          exporters: [prometheusremotewrite, prometheus]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo, spanmetrics]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [loki]
