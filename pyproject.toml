[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sre-incident-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Agent
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
    # Schemas & validation
    "pydantic>=2.7",
    # HTTP clients
    "httpx>=0.27",
    # Logging
    "structlog>=24.1",
    # CLI
    "click>=8.1",
    # Evaluation & data
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    # Retry
    "tenacity>=8.3",
    # K8s
    "kubernetes>=29",
    # Env
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-requests",
]

[project.scripts]
sre-copilot = "src.agent.run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "eval*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short"
